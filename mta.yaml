_schema-version: 3.3.0
ID: error-plugin
version: 2.1.0
description: "Fiori Launchpad plugin that captures error messages and opens Ask AI for them."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
modules:
  - name: error-plugin-destinations
    type: com.sap.application.content
    requires:
      - name: error-plugin-auth
        parameters:
          service-key:
            name: error-plugin-auth-key
      - name: error-plugin-html5-repo-host
        parameters:
          service-key:
            name: error-plugin-html5-repo-host-key
      - name: error-plugin-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: error-plugin-html5-repository
              ServiceInstanceName: error-plugin-html5-repo-host
              ServiceKeyName: error-plugin-html5-repo-host-key
              sap.cloud.service: errorplugin.service
            - Name: error-plugin-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: error-plugin-auth
              ServiceKeyName: error-plugin-auth-key
              sap.cloud.service: errorplugin.service

  - name: error-plugin-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: error-plugin-ui
          artifacts:
            - error.capture.plugin.zip
          target-path: app/
    requires:
      - name: error-plugin-auth
      - name: error-plugin-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true

  - name: error-plugin-ui
    type: html5
    path: app/error.capture.plugin
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

resources:
  - name: error-plugin-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: error-plugin
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
  - name: error-plugin-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        # makes this instance's destinations visible to Work Zone's managed runtime,
        # which is how the site discovers the plugin in the HTML5 repo
        HTML5Runtime_enabled: true

  - name: error-plugin-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
