appTitle=Error Capture Plugin
appDescription=FLP plugin that captures error and warning messages from standard and custom Fiori apps and lets the user ask AI about them

#XBUT: Button added to error/warning dialogs (MessageBox) and to each row of the error list
askAiButton=Ask AI
#XTOL: Tooltip of the Ask AI button in error/warning dialogs and in the error list
askAiButtonTooltip=Ask AI about this message (opens in a new tab)

#XBUT: Launchpad header button, shown while the open app has captured errors
askAiHeaderText=Ask AI
#XTOL: Tooltip of the launchpad header button with one captured error
askAiHeaderTooltipOne=Ask AI: 1 error in this app
#XTOL: Tooltip of the launchpad header button; {0} is the number of captured errors
askAiHeaderTooltipMany=Ask AI: {0} errors in this app

#XTIT: Title of the dialog listing the captured errors; {0} is their number
errorListTitle=Errors in This App ({0})
#XMSG: Hint at the top of the error list
errorListIntro=Select Ask AI next to an error to get help with it. The answer opens in a new tab.
#XMSG: Error list without entries
errorListEmpty=No errors in this app
#XBUT: Removes all errors from the list and hides the header button
errorListClear=Clear List
#XBUT
errorListClose=Close

#XFLD: Where an error in the list came from
errorSourceDialog=Shown in a dialog
#XFLD
errorSourceMessages=Shown in the app's messages
#XFLD
errorSourceHttp=Backend call failed
#XFLD
errorSourceScript=Script error
#XFLD: How often the same error occurred in this app; {0} is the number (2 or more)
errorOccurrences={0} times

#XMSG: Toast when an error occurs that the user did not see in a dialog with an Ask AI button
errorNotification=An error occurred in this app. Select Ask AI at the top right to get help with it.

#XMSG: Failed backend calls without a message of their own are described from the HTTP status;
# the plugin appends the technical part, e.g. "(HTTP 404, GET ZSD_SRV/Orders)"
httpError400=The request was rejected by the server.
#XMSG
httpError401=Your session has expired or you are not logged on.
#XMSG
httpError403=You are not authorized to perform this action.
#XMSG
httpError404=The requested data or service was not found.
#XMSG
httpError408=The server did not respond in time.
#XMSG
httpError409=The request conflicts with the current state of the data.
#XMSG
httpError412=The data was changed by someone else in the meantime.
#XMSG
httpError413=The request is too large for the server.
#XMSG
httpError429=The server received too many requests. Try again later.
#XMSG
httpError500=The server encountered an internal error.
#XMSG
httpError502=The backend system is currently not reachable.
#XMSG
httpError503=The service is temporarily unavailable.
#XMSG
httpError504=The backend system did not respond in time.
#XMSG: Any other 4xx status
httpError4xx=The request could not be processed.
#XMSG: Any other 5xx status
httpError5xx=The server could not process the request.
#XMSG: No response at all (network failure, blocked request)
httpErrorNetwork=The connection to the server failed.
